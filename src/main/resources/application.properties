spring.application.name=SpringShop
spring.main.banner-mode=off
server.port=${SERVER_PORT:3000}
logging.level.root=${LOGGING_LEVEL_ROOT:warn}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:info}
logging.level.org.hibernate=error

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springshop}?sslmode=${DB_SSL_MODE:disable}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:900000}
security.rate-limit.enabled=true
security.rate-limit.capacity=100
security.rate-limit.refill-tokens=100
security.rate-limit.refill-period=1m
security.rate-limit.fail-open=true
security.rate-limit.use-forwarded-headers=${RATE_LIMIT_USE_FORWARDED_HEADERS:false}
security.rate-limit.key-prefix=springshop:rate-limit

spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
spring.cache.type=redis

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.product-images-dir=${PRODUCT_IMAGES_DIR:uploads/products}
app.upload.public-path=/uploads/products
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://springshop-tau.vercel.app}
app.seed.enabled=${APP_SEED_ENABLED:true}

app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.currency=${STRIPE_CURRENCY:eur}
app.stripe.success-url=${STRIPE_SUCCESS_URL}
app.stripe.cancel-url=${STRIPE_CANCEL_URL}
