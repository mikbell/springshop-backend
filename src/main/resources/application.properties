spring.application.name=SpringShop
spring.main.banner-mode=off
logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=900000
security.rate-limit.enabled=true
security.rate-limit.capacity=100
security.rate-limit.refill-tokens=100
security.rate-limit.refill-period=1m
security.rate-limit.fail-open=true
security.rate-limit.use-forwarded-headers=false
security.rate-limit.key-prefix=springshop:rate-limit

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.product-images-dir=${PRODUCT_IMAGES_DIR:uploads/products}
app.upload.public-path=/uploads/products
