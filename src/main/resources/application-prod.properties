logging.level.root=${LOGGING_LEVEL_ROOT:info}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:warn}
logging.level.org.hibernate=warn

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

security.jwt.secret-key=${JWT_SECRET_KEY}
security.rate-limit.fail-open=false
security.rate-limit.use-forwarded-headers=${RATE_LIMIT_USE_FORWARDED_HEADERS:true}

app.seed.enabled=${APP_SEED_ENABLED:false}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
