# Test-specific overrides for application.properties
# These override the values from src/main/resources/application.properties during testing.

# Use H2 for @SpringBootTest tests that don't use the 'integration' profile
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable caching so @WebMvcTest slices don't require a CacheManager bean
spring.cache.type=none

# JWT secret for tests (must be at least 256-bit / 32 chars for HS256)
security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=900000
